services:
  taxi-mongo:
    image: mongo:7
    container_name: taxi-mongo-se5
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - ./validation.js:/docker-entrypoint-initdb.d/01-validation.js:ro
      - ./data.js:/docker-entrypoint-initdb.d/02-data.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 20

  taxi-redis:
    image: redis:7-alpine
    container_name: taxi-redis-se5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: src
      dockerfile: Dockerfile
    container_name: taxi-api-se5
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-8002}:${API_PORT:-8002}"
    depends_on:
      taxi-mongo:
        condition: service_healthy
      taxi-redis:
        condition: service_healthy
    environment:
      MONGO_HOST: taxi-mongo
      MONGO_PORT: 27017
      MONGO_DB: taximongo
      REDIS_HOST: taxi-redis
      REDIS_PORT: 6379
      API_PORT: ${API_PORT:-8002}

volumes:
  mongo_data:
