[project]
name = "2026-se-5"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.135",
  "motor>=3.7",
  "pydantic>=2.12",
  "pydantic-settings>=2.13",
  "redis>=5.2",
  "uvicorn[standard]>=0.42",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.11"
ty = ">=0.0.39"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["lib", "bin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["lib"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["lib", "bin"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
